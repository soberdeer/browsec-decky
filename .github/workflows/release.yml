name: Release Decky plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Validate release version
        shell: bash
        run: |
          set -Eeuo pipefail
          project_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$tag_version" == "$project_version" ]]
          printf 'PROJECT_VERSION=%s\n' "$project_version" >>"$GITHUB_ENV"

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Test and build
        run: corepack pnpm run verify

      - name: Import verified official runtime
        run: ./scripts/import-runtime.sh

      - name: Package release
        run: corepack pnpm run package

      - name: Store verified files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browsec-decky-release
          path: |
            out/Browsec-Decky-*.zip
            out/Browsec-Decky-*.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download verified files
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: browsec-decky-release
          path: out

      - name: Verify and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          project_version="${GITHUB_REF_NAME#v}"
          cd out
          sha256sum --check "Browsec-Decky-${project_version}.sha256"
          gh release create "$GITHUB_REF_NAME" \
            "Browsec-Decky-${project_version}.zip" \
            "Browsec-Decky-${project_version}.sha256" \
            --verify-tag \
            --title "Browsec Decky ${PROJECT_VERSION}" \
            --generate-notes
